[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trace-core"
version = "0.2.0"
description = "Time-aware, Referenced, Attributed, Corroborated Evidence — an evidence-to-behaviour library, with a trait layer that measures and predicts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
  "stylometry",
  "behaviour",
  "evidence",
  "provenance",
  "confidence",
  "attribution",
  "traits",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]

# Intentionally empty. TRACE ships no transitive dependencies: the decision layer
# is pure arithmetic over dataclasses, and a library that infers behaviour from a
# user's private text should not drag a transitive tree into their environment.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "mypy>=1.10",
  "ruff>=0.6",
]

[project.scripts]
trace-traits = "trace_traits.cli:main"

# [project.urls] is added in the first post-release edit, pointing at the
# public repository once it exists.

[tool.hatch.build.targets.wheel]
packages = ["src/trace_core", "src/trace_traits"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# The verification harness is excluded from linting, and deliberately so.
# `verification/probe_*.py` are standalone scripts that insert `src` onto
# `sys.path` before importing the library, which is exactly what the import
# sorter objects to. The two files that ARE part of the verification
# contract — `ground_truth.py` and `run_verification.py` — are linted, and
# are clean.
# `fuzz_harness.py` is excluded for the same reason, plus a little: it is a
# standalone audit script that imports broadly to check what is reachable,
# and unused imports there are the point of some of its checks.
exclude = [
  "verification/probe_*.py",
  "verification/attack_*.py",
  "verification/fuzz_harness.py",
]
# Band vocabulary is policy, not core (PLAN.md D1), so "magic number" is wrong here:
# every coefficient in the library is the integrator's to choose.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: needs a live model and a network; skipped without TRACE_LLM_API_KEY",
]
